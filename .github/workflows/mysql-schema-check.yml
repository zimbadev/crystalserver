---
name: MySQL Schema Check
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "schema.sql"
  merge_group:
  push:
    paths:
      - "schema.sql"
    branches:
      - main

jobs:
  mysql-schema-check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: crystalserver
          MYSQL_USER: crystalserver
          MYSQL_PASSWORD: crystalserver
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    strategy:
      fail-fast: false
    name: Check
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
      - name: Import Crystal Server Schema
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          docker exec -i "$MYSQL_CONTAINER" mysql -uroot -proot crystalserver < schema.sql
